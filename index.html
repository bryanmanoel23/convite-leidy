<!DOCTYPE html>
<html>
<head>
    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Convite</title>

<style>
    
html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    position:fixed;
    inset:0;

    font-family:Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    background:url("./Leidy.png") center center / cover no-repeat;
}
    
.caixa{
    position:absolute;

    left:50%;
    bottom:35px;
    transform:translateX(-50%);

    width:78%;
    max-width:320px;
    
    padding:16px 18px;

    border-radius:28px;

    text-align:center;

    background:rgba(20,20,20,.28);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:
        0 15px 45px rgba(0,0,0,.35);

    overflow:visible;
}

.caixa::before{

    content:"";
    position:absolute;
    inset:0;

    padding:2px;
    border-radius:28px;

    background:linear-gradient(
    135deg,
    #ff0080,
    #7928ca,
    #00d4ff,
    #39ff14,
    #ff0080
);

    background-size:300% 300%;
    animation:borda 8s linear infinite;

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;
}
    
.caixa::after{

    content:"";
    position:absolute;
    inset:2px;

    border-radius:26px;

    background:rgba(0,0,0,.22);

    z-index:1;
}

.caixa > *{
    position:relative;
    z-index:2;
}

h2{
    font-size:32px;
    line-height:1.25;
    margin:0 0 25px;
    color:#fff;
    text-shadow:0 3px 10px rgba(0,0,0,.9);
}

@keyframes borda{
    0%{
        background-position:0% 50%;
    }

    100%{
        background-position:300% 50%;
    }
}
    
button{
    width:120px;
    height:55px;

    border:none;
    border-radius:18px;

    font-size:22px;
    font-weight:bold;

    color:white;

    cursor:pointer;

    transition:.25s;
}

.sim{
    background:#34c759;
    color:white;
    box-shadow:0 8px 20px rgba(52,199,89,.45);
}

.sim:hover{
    transform:scale(1.05);
}

.nao{
    background:#ff3b30;
    color:white;
    box-shadow:0 8px 20px rgba(255,59,48,.45);
    transition:left .15s linear,
               top .15s linear;
}
    
.botoes{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
}

</style>
</head>
<body>

<div class="caixa">

    <h2>Vamos nos ver hoje? 👀</h2>

    <div class="botoes">
        <button class="sim" onclick="aceitou()">Sim 💖</button>
        <button class="nao" id="nao">Não</button>
    </div>

</div>

<script>
const btn = document.getElementById("nao");

let primeiraVez = true;

// Desktop
btn.addEventListener("pointerenter", fugir);

// Celular
btn.addEventListener("pointerdown", fugir);

function fugir(e){

    e.preventDefault();

    // Só tira o botão da caixa uma única vez
    if(primeiraVez){

        const rect = btn.getBoundingClientRect();

        btn.style.position = "fixed";
        btn.style.left = rect.left + "px";
        btn.style.top = rect.top + "px";
        btn.style.margin = "0";
        btn.style.zIndex = "9999";

        primeiraVez = false;
    }

    const margem = 20;

    const largura = window.innerWidth - btn.offsetWidth - margem * 2;
    const altura = window.innerHeight - btn.offsetHeight - margem * 2;

    const x = margem + Math.random() * largura;
    const y = margem + Math.random() * altura;

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

function aceitou(){

    document.querySelector("h2").innerHTML =
    "Perfeito! ❤️ Agora é só escolher o horário.";

    btn.style.display = "none";
    document.querySelector(".sim").style.display = "none";
}
</script>

</body>
</html>
