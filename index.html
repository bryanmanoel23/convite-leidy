<!DOCTYPE html>
<html>
<head>
    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Convite</title>

<style>
    
body{
    position:relative;
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100dvh;
    width:100vw;
    margin:0;
    overflow:hidden;

    background-image:url('./Leidy.PNG');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}
    
.caixa{
    position:relative;

    padding:60px 40px;
    border-radius:35px;
    text-align:center;

    width:90%;
    max-width:450px;

    background:rgba(0,0,0,0.25);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    overflow:unset;
}

.caixa::before{
    content:"";
    position:absolute;
    inset:0;

    border-radius:35px;
    padding:3px;

    background:conic-gradient(
        #ff0080,
        #7928ca,
        #00d4ff,
        #39ff14,
        #ff0080
    );

    animation:borda 4s linear infinite;

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;

    z-index:0;
}
    
.caixa::after{
    content:"";
    position:absolute;
    inset:3px;

    background:rgba(0,0,0,0.45);
    border-radius:32px;

    z-index:1;
}

.caixa > *{
    position:relative;
    z-index:2;
}

@keyframes borda{
    0%{
        background-position:0% 50%;
    }

    100%{
        background-position:300% 50%;
    }
}

h2{
    font-size:42px;
    line-height:1.2;
    margin-bottom:40px;
    color:white;
}

button{
    padding:20px 38px;
    border:none;
    border-radius:18px;
    font-size:26px;
    margin:15px;
    cursor:pointer;
}

.sim{
    background:#34c759;
    color:white;
}

.nao{
    background:#ff3b30;
    color:white;
}
    
.botoes{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
}

</style>
</head>
<body>

<div class="caixa">
    <h2>Vamos nos ver hoje? 👀</h2>

    <div class="botoes">
        <button class="sim" onclick="aceitou()">Sim💖</button>
        <button class="nao" id="nao">Não</button>
    </div>
</div>

<script>
const btn = document.getElementById("nao");

btn.addEventListener("pointerenter", fugir);
btn.addEventListener("pointerdown", fugir);

let ativado = false;

function fugir(e){

    e.preventDefault();

    btn.style.position = "fixed";
    btn.style.margin = "0";
    btn.style.transform = "none";
    btn.style.zIndex = "9999";

    const margem = 20;

    const largura = window.innerWidth - btn.offsetWidth - margem;
    const altura = window.innerHeight - btn.offsetHeight - margem;

    const x = Math.random() * largura;
    const y = Math.random() * altura;

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

    function aceitou(){
        document.querySelector("h2").innerHTML =
            "Perfeito! ❤️ Agora é só escolher o horário.";
        document.querySelector(".sim").style.display = "none";
        document.querySelector(".nao").style.display = "none";
    }
    
</script>

</body>
</html>
